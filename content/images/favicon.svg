<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Favicon</title>
  <style>
    .ink { fill: #14171a; }
    .out { fill: none; stroke: #14171a; stroke-width: 2.5; }
    .accent { fill: #0a6f68; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6dae0; }
      .out { stroke: #d6dae0; }
      .accent { fill: #3fb9ac; }
    }
  </style>
  <rect class="ink" x="4" y="4" width="10" height="10"/>
  <rect class="out" x="19.25" y="5.25" width="7.5" height="7.5"/>
  <rect class="out" x="5.25" y="19.25" width="7.5" height="7.5"/>
  <rect class="accent" x="18" y="18" width="10" height="10"/>
</svg>
